name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All jobs run on the self-hosted gpu_dev runner which has every dependency
# pre-installed: CUDA 12.8, libtorch, ONNX Runtime, Go, Rust, Docker.
# No download/install overhead — builds are fast.
defaults:
  run:
    shell: bash

jobs:
  # ── Go: lint ─────────────────────────────────────────────────────────────────
  go-lint:
    name: Go lint
    runs-on: [self-hosted, linux, x64, cuda]
    steps:
      - uses: actions/checkout@v6

      - name: golangci-lint
        run: |
          cd go
          export PATH=$HOME/.local/bin:$PATH
          golangci-lint run --timeout=5m || \
            (go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest && golangci-lint run --timeout=5m)

  # ── Go: vet + pure-Go tests ──────────────────────────────────────────────────
  go-test:
    name: Go tests
    runs-on: [self-hosted, linux, x64, cuda]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: go vet
        working-directory: go
        run: go vet ./hub/... ./grpc/... ./client/... ./tracker/... ./analytics/...

      - name: go test (pure-Go packages)
        working-directory: go
        run: go test -race -count=1 -timeout=120s ./hub/... ./grpc/... ./client/... ./tracker/... ./analytics/...

      - name: go test (server)
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -timeout=120s ./server/...

  # ── C++: format check ────────────────────────────────────────────────────────
  cpp-format:
    name: C++ format check
    runs-on: [self-hosted, linux, x64, cuda]
    steps:
      - uses: actions/checkout@v6
      - name: clang-format check
        run: |
          find cpp -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \
            | grep -v vendor \
            | xargs clang-format --dry-run --Werror

  # ── C++: build + gtest (CPU) ─────────────────────────────────────────────────
  cpp-test:
    name: C++ build + tests (CPU)
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build Rust tokenizer
        run: cargo build --release --manifest-path tokenizer-rs/Cargo.toml

      - name: Generate ONNX test fixtures
        run: |
          python3 - <<'EOF'
          import numpy as np, onnx
          from onnx import numpy_helper, TensorProto, helper
          x = helper.make_tensor_value_info('x', TensorProto.FLOAT, [1, 4])
          y = helper.make_tensor_value_info('y', TensorProto.FLOAT, [1, 4])
          scale = numpy_helper.from_array(np.array([2.0], dtype=np.float32), name='scale')
          node = helper.make_node('Mul', inputs=['x', 'scale'], outputs=['y'])
          graph = helper.make_graph([node], 'scale', [x], [y], initializer=[scale])
          model = helper.make_model(graph, opset_imports=[helper.make_opsetid('', 17)])
          onnx.save(model, '/tmp/scale.onnx')
          EOF

      - name: Configure (CPU)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=OFF \
            -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS \
            -DINFER_CUDA=OFF \
            -DINFER_TESTS=ON \
            -DONNXRUNTIME_ROOT=/opt/onnxruntime

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(nproc)

  # ── C++: build + gtest (CUDA) — only possible on self-hosted GPU runner ──────
  cpp-test-cuda:
    name: C++ build + tests (CUDA)
    runs-on: [self-hosted, linux, x64, cuda, gpu]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build Rust tokenizer
        run: cargo build --release --manifest-path tokenizer-rs/Cargo.toml

      - name: Configure (CUDA)
        run: |
          cmake -S . -B build-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=89 \
            -DINFER_CUDA=ON \
            -DINFER_TESTS=ON \
            -DONNXRUNTIME_ROOT=/opt/onnxruntime \
            -DTorch_DIR=$(python3 -c "import torch; print(torch.utils.cmake_prefix_path)")/Torch

      - name: Build
        run: cmake --build build-cuda -j$(nproc)

      - name: Test
        run: ctest --test-dir build-cuda --output-on-failure -j$(nproc)

  # ── Helm: lint + dry-run ─────────────────────────────────────────────────────
  helm-lint:
    name: Helm lint
    runs-on: [self-hosted, linux, x64, cuda]
    steps:
      - uses: actions/checkout@v6
      - run: helm lint deploy/helm/infergo/
      - run: helm template infergo deploy/helm/infergo/ --debug > /dev/null

  # ── Docker: CPU + CUDA (self-hosted has Docker + GPU) ────────────────────────
  docker-build:
    name: Docker build (CPU + CUDA)
    runs-on: [self-hosted, linux, x64, cuda, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build CPU image
        run: docker build -f Dockerfile.cpu -t infergo:cpu-test .

      - name: Build CUDA image
        run: docker build -f Dockerfile.cuda -t infergo:cuda-test .

  # ── Summary gate ─────────────────────────────────────────────────────────────
  ci-pass:
    name: CI pass
    needs: [go-lint, go-test, cpp-test, cpp-test-cuda, helm-lint, docker-build]
    runs-on: [self-hosted, linux, x64, cuda]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          if echo "$results" | grep -q '"result":"failure"'; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
