name: Stale Issues and PRs

on:
  schedule:
    - cron: '0 6 * * *'  # Daily 06:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: >
            This issue has been inactive for 30 days. It will be closed in 7 days
            unless there is further activity. If this is still relevant, please
            comment or remove the `stale` label.
          stale-pr-message: >
            This PR has been inactive for 14 days. It will be closed in 7 days
            unless there is further activity. If you're still working on this,
            please push a commit or remove the `stale` label.
          close-issue-message: >
            Closing due to inactivity. Please reopen if this is still relevant.
          close-pr-message: >
            Closing due to inactivity. Please reopen if you'd like to continue.
          days-before-stale: 30
          days-before-close: 7
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'pinned,security,bug,enhancement'
          exempt-pr-labels: 'pinned,security,do-not-close'
