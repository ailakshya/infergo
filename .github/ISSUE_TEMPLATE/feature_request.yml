name: Feature Request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check the [roadmap](https://github.com/ailakshya/infergo/blob/main/optimization_tasks.md) — it may already be planned.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - LLM performance
        - Detection performance
        - New model type support
        - New hardware backend (TPU, ASIC, etc.)
        - SDK / language binding
        - API / endpoints
        - Deployment / Docker / Kubernetes
        - Training / fine-tuning
        - Developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point. What can't you do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would the feature look like? Include API design if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds exist today? Why are they insufficient?

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'm willing to implement this
